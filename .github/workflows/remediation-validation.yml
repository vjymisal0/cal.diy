name: Targeted remediation validation
on:
  push:
    branches: ['remediation-ci/caldiy-*']
permissions:
  contents: read
concurrency:
  group: caldiy-remediation-${{ github.sha }}
  cancel-in-progress: false
env:
  BASE_SHA: ef7954d16ab50882ca2f263c551537115b8a8bb1
  TZ: UTC
  NODE_OPTIONS: --max-old-space-size=12288
  YARN_NM_MODE: hardlinks-local
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: '30212'
            source: 6e78273c68e98389c6eb03fe96ccba032d22b790
            production: packages/lib/CalendarService.ts
            tests: packages/lib/CalendarService.test.ts
          - pr: '30181'
            source: 090f031b099a14a2b8eabdabb46f55fae142f3cc
            production: packages/features/schedules/lib/date-ranges.ts
            tests: packages/features/schedules/lib/date-ranges.test.ts
    env:
      SOURCE_SHA: ${{ matrix.source }}
      TEST_FILE: ${{ matrix.tests }}
      PRODUCTION_FILE: ${{ matrix.production }}
    steps:
      - name: Check out exact implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact source and prepare example environment
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          mkdir -p .remediation-validation
          git rev-parse HEAD > .remediation-validation/source-sha.txt
          git diff --stat "$BASE_SHA"...HEAD > .remediation-validation/scope.txt
          cp .env.example .env
          cp .env.appStore.example .env.appStore
      - name: Prepare repository CI Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Install locked dependencies with normal lifecycle scripts
        id: install
        run: |
          set -o pipefail
          node .yarn/releases/yarn-4.12.0.cjs install --immutable --inline-builds 2>&1 | tee .remediation-validation/install.log
      - name: Generate Prisma client as in repository unit CI
        id: prisma
        run: node .yarn/releases/yarn-4.12.0.cjs prisma generate
      - name: Run relevant unit suite
        run: |
          node .yarn/releases/yarn-4.12.0.cjs vitest run "$TEST_FILE" --reporter=json --outputFile=.remediation-validation/units.json > .remediation-validation/units.log 2>&1
      - name: Check changed files with repository Biome
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          node .yarn/releases/yarn-4.12.0.cjs biome check "$PRODUCTION_FILE" "$TEST_FILE" 2>&1 | tee .remediation-validation/biome.log
      - name: Required forced type checks
        id: types
        if: always() && steps.prisma.outcome == 'success'
        run: |
          set +e
          node .yarn/releases/yarn-4.12.0.cjs type-check:ci --force > .remediation-validation/types-pr.log 2>&1
          status=$?
          tail -n 120 .remediation-validation/types-pr.log
          printf '%s\n' "$status" > .remediation-validation/types-pr-exit.txt
          exit "$status"
      - name: Exact base type-check comparison when required
        if: always() && steps.types.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          paths = [pathlib.Path(os.environ[key]) for key in ['PRODUCTION_FILE', 'TEST_FILE']]
          original = {p: p.read_bytes() for p in paths}
          try:
              for p in paths:
                  p.write_bytes(subprocess.check_output(['git', 'show', os.environ['BASE_SHA'] + ':' + str(p)]))
              with pathlib.Path('.remediation-validation/types-base.log').open('wb') as log:
                  result = subprocess.run(['node', '.yarn/releases/yarn-4.12.0.cjs', 'type-check:ci', '--force'], stdout=log, stderr=subprocess.STDOUT)
              pathlib.Path('.remediation-validation/types-base-exit.txt').write_text(str(result.returncode))
              print('Exact base type-check exit:', result.returncode)
          finally:
              for p, content in original.items(): p.write_bytes(content)
          PY
      - name: Prove regression against exact base implementation
        if: always() && steps.prisma.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          p = pathlib.Path(os.environ['PRODUCTION_FILE'])
          original = p.read_bytes()
          try:
              p.write_bytes(subprocess.check_output(['git', 'show', os.environ['BASE_SHA'] + ':' + str(p)]))
              out = pathlib.Path('.remediation-validation')
              with (out / 'base-regression.log').open('wb') as log:
                  result = subprocess.run(['node', '.yarn/releases/yarn-4.12.0.cjs', 'vitest', 'run', os.environ['TEST_FILE'], '--reporter=json', '--outputFile=.remediation-validation/base-regression.json'], stdout=log, stderr=subprocess.STDOUT)
              evidence = json.loads((out / 'base-regression.json').read_text())
              assert result.returncode != 0 and evidence['numFailedTests'] > 0, evidence
              print('Base implementation regression failures:', evidence['numFailedTests'])
          finally:
              p.write_bytes(original)
          PY
      - name: Verify source restoration
        if: always()
        run: git diff --exit-code -- '*.ts' '*.tsx' '*.json' yarn.lock .yarnrc.yml
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: caldiy-remediation-${{ matrix.pr }}
          path: .remediation-validation
          include-hidden-files: true
          retention-days: 7
